[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-eib"
version = "0.1.0"
description = "Fail-closed evidence and replay checks for the CR-EIB pilot"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema==4.25.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
