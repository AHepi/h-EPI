[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conformance-harness"
version = "0.5.0"
description = "Criticism-first harness for checking a language model's form filling against a content-bound form and instructions, without confirming the model"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.25.1",
  "referencing==0.37.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
