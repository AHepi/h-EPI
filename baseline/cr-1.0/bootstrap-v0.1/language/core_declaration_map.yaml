    status_handling: "candidate model-structure import"
    statement:
      raw: &MS_1_statement >-
        (T,<) is a strict partial order; H is a nonempty family of admissible histories, not only the actual trace.
      normalized: *MS_1_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A01", "CM-A04"]

  MS-2:
    id: "MS-2"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [221], printed_pages: [220]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate model-structure import"
    statement:
      raw: &MS_2_statement >-
        E(h,t) supplies typed events and Σ(h,t) the abstract state. B(s,h,t) fixes a declared system/environment boundary. Nested boundaries are permitted but cannot be changed after seeing which one yields the preferred attribution.
      normalized: *MS_2_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A03", "CM-A04", "CM-A07", "CM-A34"]

  MS-3:
    id: "MS-3"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate model-structure import"
    statement:
      raw: &MS_3_statement >-
        Rep(s,z,h,t) relates a causally accessible token/state to content z; ≡_L is the declared content-equivalence relation. Encoding changes may preserve content and surface similarity may fail to preserve it.
      normalized: *MS_3_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A04", "CM-A06"]

  MS-4:
    id: "MS-4"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: [], note: "clause calls these substantive modeling imports"}
    inferential_status: "IMP"
    status_handling: "candidate causal/modeling import"
    statement:
      raw: &MS_4_statement >-
        Prov is a causal-credit graph spanning architecture/design, inherited or trained repertoire, stored content, episode inputs, tools/interlocutors, candidates, criticisms and revisions. CLine(s,x_0,x_1,c,alpha,y,p,b,h,I) marks one connected, role-preserving subgraph in which an authored attempt x_0, the criticized candidate x_1, reason-specific response alpha, and endpoint problem situation y belong to the same causal episode. StableOrg(s,Q,chi) is an independently interpreted causal-stability predicate over declared perturbations, resources and problem class. CF supplies interventions with declared held-fixed conditions. These relations are substantive modeling imports, not consequences of drawing arrows.
      normalized: *MS_4_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A04", "CM-A07", "CM-A10"]

  MS-5:
    id: "MS-5"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate semantic import"
    statement:
      raw: &MS_5_statement >-
        Purports(x,p,b) says that x is offered as an explanation of problem p against background b. It can be false or fail to explain. Explains(x,p,b) is a primitive, substantive semantic relation. It is not defined as prediction, compression, usefulness, acceptance or survival.
      normalized: *MS_5_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A05"]

  MS-6:
    id: "MS-6"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate semantic comparison import"
    statement:
      raw: &MS_6_statement >-
        SameJob, Var_V and BearsOn type explanatory comparison. CritOf(c,x,p,b,k) alleges a defect in x relative to problem-bearing standard k. Pref is a time-indexed, provisional preference among actual rivals. Reach(x,p',b') records a further problem/context to which unchanged explanatory commitments of x apply.
      normalized: *MS_6_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A04", "CM-A07", "CM-A32"]

  MS-7:
    id: "MS-7"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate modal repertoire/memory import"
    statement:
      raw: &MS_7_statement >-
        R(s,h,t) is the available operation repertoire; Mem(s,h,t) is causally accessible memory. Availability is modal over admissible continuations, not actual occurrence.
      normalized: *MS_7_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A07"]

  MS-8:
    id: "MS-8"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate epistemic and truth import"
    statement:
      raw: &MS_8_statement >-
        K_E(x,p,b,h,t) is a primitive explanatory-knowledge predicate: x constitutes a fallible improvement in the explanatory problem situation, not merely persistence or endorsement. True(x,p,b) is an independent correspondence predicate when an application supplies one. CR-1.0 does not reduce K_E to a score or identify it with perfect truth. Applications must supply domain-specific epistemic and truth interpretations.
      normalized: *MS_8_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A14"]

  MS-9:
    id: "MS-9"
    family: "MS"
    section: "Model §1.2 Abstract model"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate resource-accounting import"
    statement:
      raw: &MS_9_statement >-
        Cost records declared resources. No unboundedness or efficiency claim is meaningful without it.
      normalized: *MS_9_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A07"]

  SC-1:
    id: "SC-1"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate satisfaction import"
    statement:
      raw: &SC_1_statement >-
        M,h,t |= e iff typed event e ∈ E(h,t).
      normalized: *SC_1_statement
    direct_dependencies: {ids: ["MS-2"], raw: null, basis: "reconstructed from explicit symbol reference; non-exhaustive"}
    blockers: ["CM-A03"]

  SC-2:
    id: "SC-2"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate representation satisfaction import"
    statement:
      raw: &SC_2_statement >-
        M,h,t |= Represents(s,z) iff an internal discriminable token/state realizes z and at least one available operation uses the difference between it and relevant alternatives. An observer's label alone is insufficient.
      normalized: *SC_2_statement
    direct_dependencies: {ids: ["MS-3", "MS-7"], raw: null, basis: "reconstructed from explicit symbol reference; non-exhaustive"}
    blockers: ["CM-A06"]

  SC-3:
    id: "SC-3"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: "M", tags: [], note: "PDF: This is an M reconstruction of content-sensitive causation."}
    inferential_status: "IMP"
    status_handling: "candidate causal-uptake import"
    statement:
      raw: &SC_3_statement >-
        M,h,t |= UsesReason(s,c,α) iff reason-content-preserving recodings of c preserve the relevant response family, while interventions changing the alleged defect—matched where possible for format, salience and channel—change α in defect-appropriate ways. This is an M reconstruction of content-sensitive causation.
      normalized: *SC_3_statement
    direct_dependencies: {ids: ["MS-4"], raw: null, basis: "reconstructed from intervention reference; non-exhaustive"}
    blockers: ["CM-A04", "CM-A07"]

  SC-4:
    id: "SC-4"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate authorship import"
    statement:
      raw: &SC_4_statement >-
        M,h,I |= Authors_s(x,p) iff the causal-credit explanation over the predeclared boundary assigns construction or reconstruction of the problem-specific explanatory organization in x to operations of s, rather than merely to retrieval, a stock answer, a designer-prepared response, a fixed evaluator that already embodies the target adaptation, or an external selector. Prior enabling knowledge does not by itself defeat authorship.
      normalized: *SC_4_statement
    direct_dependencies: {ids: ["MS-2", "MS-4"], raw: null, basis: "reconstructed from boundary and provenance references; non-exhaustive"}
    blockers: ["CM-A08", "CM-A32"]

  SC-5:
    id: "SC-5"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate explanation-interpretation import"
    statement:
      raw: &SC_5_statement >-
        M,h,t |= Explains(x,p,b) only under the supplied explanation interpretation for the domain. Predictive fit is neither necessary nor sufficient by this clause.
      normalized: *SC_5_statement
    direct_dependencies: {ids: ["MS-5"], raw: null, basis: "reconstructed from explicit symbol reference; non-exhaustive"}
    blockers: []

  SC-6:
    id: "SC-6"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [222], printed_pages: [221]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate physical/modal import"
    statement:
      raw: &SC_6_statement >-
        Possible_Θ(φ) is true iff a named physical theory Θ admits an arbitrarily accurate realization at the stated tolerance when that is what its modality means. Abstract consistency alone is not physical possibility.
      normalized: *SC_6_statement
    direct_dependencies: {ids: ["TY-2", "TY-3"], raw: null, basis: "reconstructed from explicit baseline and cross-type requirements; non-exhaustive"}
    blockers: ["CM-A04"]

  SC-7:
    id: "SC-7"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate retention import"
    statement:
      raw: &SC_7_statement >-
        M,h,t |= Retained_s(x) iff a token/state carrying x, or a causally sufficient reconstructible disposition for it, is accessible to a relevant possible later operation of s. Retention is neither endorsement nor K_E.
      normalized: *SC_7_statement
    direct_dependencies: {ids: ["MS-3", "MS-7"], raw: null, basis: "reconstructed from token/state and availability references; non-exhaustive"}
    blockers: ["CM-A08"]

  SC-8:
    id: "SC-8"
    family: "SC"
    section: "Model §1.3 Satisfaction clauses"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate critical-lineage import"
    statement:
      raw: &SC_8_statement >-
        M,h,I |= CLine(s,x_0,x_1,c,alpha,y,p,b,h,I) only if one predeclared Prov subgraph and its matched counterfactuals establish all of the following: x_0 is the originating attempt; x_1 is x_0 or a revision/reconstruction descended from it; c targets x_1 on problem p; the reason-content of c makes a defect-appropriate causal difference to response alpha; and y is the retained/revised/rejected/reframed endpoint produced by that response. Temporal co-occurrence or analyst-assigned topic similarity is insufficient.
      normalized: *SC_8_statement
    direct_dependencies: {ids: ["MS-4", "SC-3", "SC-4"], raw: null, basis: "reconstructed from provenance, reason-specific response, and authorship content; non-exhaustive"}
    blockers: ["CM-A04", "CM-A08", "CM-A10"]

  DF-1:
    id: "DF-1"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: "R", tags: ["S-BOI1", "S-FOR3"]}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; exact eliminability blocked"
    statement:
      raw: &DF_1_statement >-
        Problem_s(p,b,t) iff s represents a conflict, inadequacy or unresolved relation among ideas relative to background b. A bare externally imposed reward is not yet a Deutschian problem unless it receives such a role.
      normalized: *DF_1_statement
    direct_dependencies: {ids: ["SC-2"], raw: null, basis: "reconstructed from representation reference; non-exhaustive"}
    blockers: ["CM-A11"]

  DF-2:
    id: "DF-2"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: "R", tags: []}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition"
    statement:
      raw: &DF_2_statement >-
        Attempt_s(x,p,b,t) iff Problem_s(p,b,t), s represents x, and Purports(x,p,b). Explains(x,p,b) is not required.
      normalized: *DF_2_statement
    direct_dependencies: {ids: ["DF-1", "MS-5", "SC-2"], raw: null, basis: "reconstructed from defined and primitive symbol references; non-exhaustive"}
    blockers: ["CM-A05", "CM-A06"]

  DF-3:
    id: "DF-3"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: "R", tags: ["S-FOR1", "S-BOI10", "S-BOI16"]}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; exact eliminability blocked"
    statement:
      raw: &DF_3_statement >-
        New_s^L(x,t) iff there is no earlier x' such that s represented x' as explanatory content, could deploy it in at least one problem-bearing operation, and x' ≡_L x. Historical novelty is New_H^L; the two are independent. Reconstructing another person's explanation can therefore be new-to-system without being new-to-history.
      normalized: *DF_3_statement
    direct_dependencies: {ids: ["MS-1", "MS-3", "MS-7", "SC-2"], raw: null, basis: "reconstructed from temporal, representation, equivalence, and availability references; non-exhaustive"}
    blockers: ["CM-A04", "CM-A06", "CM-A11"]

  DF-4:
    id: "DF-4"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source:
      mark_raw: "R from X"
      tags: ["S-BOI1", "S-BOI7", "S-CB12", "S-FOR1"]
      note: "S-FOR1 is identified by the PDF as correction support."
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; contextual arity blocked"
    statement:
      raw: &DF_4_statement >-
        OCA(s,x,p,b,h,t) ≡ Attempt_s(x,p,b,t) ∧ New_s^L(x,t) ∧ Authors_s(x,p). No criticism, retention, truth or success conjunct occurs. OCA is authorship of a new attempted explanation.
      normalized: *DF_4_statement
    direct_dependencies: {ids: ["DF-2", "DF-3", "SC-4"], raw: null, basis: "reconstructed from exact definiens references; non-exhaustive"}
    blockers: ["CM-A08", "CM-A32"]

  DF-4a:
    id: "DF-4a"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: "R from X", tags: ["S-BOI1", "S-CB12"]}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; modal and sort elaboration blocked"
    statement:
      raw: &DF_4a_statement >-
        OCap(s,Q,chi) iff Q is a nonempty declared problem class, StableOrg(s,Q,chi) holds, and for each admissible represented problem in Q under enabling conditions chi, there is an admissible continuation in which s performs an OCA by that organization. Q may be narrow or singleton; no criticism, success, cross-domain generality or universality is required. This is the direct modal counterpart of Deutsch's shortest definition, the capacity to create new explanations.
      normalized: *DF_4a_statement
    direct_dependencies: {ids: ["MS-1", "MS-4", "DF-4"], raw: null, basis: "reconstructed from explicit structure and predicate references; non-exhaustive"}
    blockers: ["CM-A04", "CM-A11"]

  DF-5:
    id: "DF-5"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: "R", tags: ["S-FOR3", "S-BOI1", "S-BOI14"]}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; representation elaboration blocked"
    statement:
      raw: &DF_5_statement >-
        PBCrit(s,c,x,p,b,k,t) holds iff s represents criticism c, CritOf(c,x,p,b,k), and BearsOn(k,p,b). Correctness is not required; the alleged defect must be contentful and criticizable. Inexplicit realization is allowed by SC-2.
      normalized: *DF_5_statement
    direct_dependencies: {ids: ["MS-6", "SC-2"], raw: null, basis: "reconstructed from explicit symbol and clause references; non-exhaustive"}
    blockers: ["CM-A05", "CM-A06", "CM-A11"]

  DF-6:
    id: "DF-6"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223], printed_pages: [222]}
    source: {mark_raw: "R/M", tags: ["S-FOR3", "S-BOI7"]}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; free variables block formal use"
    statement:
      raw: &DF_6_statement >-
        Uptake(s,c,x,α,h,t,t') iff PBCrit holds at t, response α at t'>t is rejection, revision, test, reasoned retention, reframing or restandardization, and UsesReason(s,c,α) holds. Mere negative-token sensitivity or temporal succession is insufficient.
      normalized: *DF_6_statement
    direct_dependencies: {ids: ["MS-1", "SC-3", "DF-5"], raw: null, basis: "reconstructed from temporal, reason-use, and defined predicate references; non-exhaustive"}
    blockers: ["CM-A04", "CM-A09", "CM-A11"]

  DF-7a:
    id: "DF-7a"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [223, 224], printed_pages: [222, 223]}
    source: {mark_raw: null, tags: []}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; quantifier and sort blockers prevent formal use"
    statement:
      raw: &DF_7a_statement >-
        CCPResult(s,y,p,b,h,I) iff there exist x_0,x_1,c,k,alpha in interval I such that: (1) OCA(s,x_0,p,b,h,t_0) occurs; (2) PBCrit(s,c,x_1,p,b,k,t_1) holds for x_1=x_0 or a lineage descendant of it; (3) Uptake(s,c,x_1,alpha,h,t_1,t_2) holds; (4) CLine(s,x_0,x_1,c,alpha,y,p,b,h,I) holds; and (5) endpoint y and the resulting problem situation are represented and available for possible further conjecture.
      normalized: *DF_7a_statement
    direct_dependencies: {ids: ["MS-7", "SC-8", "DF-4", "DF-5", "DF-6"], raw: null, basis: "reconstructed from exact clause references and availability content; non-exhaustive"}
    blockers: ["CM-A04", "CM-A08", "CM-A10", "CM-A11"]

  DF-7:
    id: "DF-7"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [224], printed_pages: [223]}
    source: {mark_raw: "R from X", tags: ["S-FOR3", "S-BOI1"]}
    inferential_status: "DEF"
    status_handling: "intended eliminable definition; inherits DF-7a blockers"
    statement:
      raw: &DF_7_statement >-
        CCP(s,p,b,h,I) iff CCPResult(s,y,p,b,h,I) for some endpoint y. The process may end worse than it began.
      normalized: *DF_7_statement
    direct_dependencies: {ids: ["DF-7a"], raw: null, basis: "reconstructed from exact definiens reference; non-exhaustive"}
    blockers: ["CM-A04", "CM-A10"]

  DF-8:
    id: "DF-8"
    family: "DF"
    section: "Model §2 Eliminable semantic definitions"
    locator: {pdf_pages: [224], printed_pages: [223]}
    source: {mark_raw: "R from X", tags: ["S-BOI1"]}
    inferential_status: "DEF"
