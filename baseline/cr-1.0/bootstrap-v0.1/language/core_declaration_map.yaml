    status_handling: "candidate primitive baseline constraint"
    statement:
      raw: &TY_2_statement >-
        Every use of new, general, possible, good, same explanation, reach, efficient or owned displays its baseline: system, content-equivalence level, theory, problem/background, resources or boundary.
      normalized: *TY_2_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A01", "CM-A04", "CM-A25", "CM-A32"]

  TY-3:
    id: "TY-3"
    family: "TY"
    section: "Model §1.1 Types"
    locator: {pdf_pages: [221], printed_pages: [220]}
    source: {mark_raw: null, tags: []}
    inferential_status: "IMP"
    status_handling: "candidate primitive cross-type constraint"
    statement:
      raw: &TY_3_statement >-
        Semantic, causal, epistemic and physical claims occupy distinct types. A cross-type inference requires a named bridge.
      normalized: *TY_3_statement
    direct_dependencies: {ids: [], raw: null, basis: "none declared by PDF"}
    blockers: ["CM-A01", "CM-A12", "CM-A33"]

