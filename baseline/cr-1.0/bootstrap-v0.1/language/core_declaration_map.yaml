    inferential_status: "IMP"
    status_handling: "candidate primitive type constraint"
    statement:
      raw: &TY_1_statement >-
        Predicates are sorted. Tokens are not their contents; prediction is not explanation; retention is not truth; physical information is not explanatory knowledge.
