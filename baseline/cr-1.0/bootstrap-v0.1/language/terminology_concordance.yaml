    ordinary_terms:
      - "creativity"
      - "creative"
    authority_meaning: >-
      Deutsch's shortest positive core is a capacity to create new explanations.
      The wider knowledge-growth history adds conjecture and criticism, while the
      source vocabulary can move among act, faculty, process, and achievement.
    active_cr_expressions:
      - "OCA"
      - "OCap"
      - "CCP"
      - "EKC"
      - "GCD"
      - "UED"
    conformance_rule: "Resolve every formal use of creativity to a displayed CR level; do not create a generic Creativity predicate."
    non_equivalences:
      - "product novelty"
      - "product value"
      - "randomness"
      - "deduction"
      - "imitation"
      - "selection"
      - "computation"
      - "construction"
