schema_version: "bootstrap-0.1"
artifact: "authority_hierarchy"
artifact_status: "draft"
semantic_and_formal_authority:
  cardinality: 1
  sole_authority:
    file: "Creativity_Semantic_Model_CR-1.0(1).pdf"
    sha256: "08ff81e848fea976b558345402d85723173be8f40f1041fb00d6267f1e026b8b"
    page_count: 286
    role: "sole semantic and formal authority"
procedural_material:
  - file: "CR-1.0_Executable_Calculus_Handoff_Plan(2).md"
    sha256: "afc2fbc6d18f6340b67a266f657a58112de9fa00d5c7d3ee557195332a8e404e"
    role: "procedural handoff only"
    semantic_authority: false
    formal_authority: false
    conflict_directive:
      statement: "If the handoff and PDF conflict, preserve the PDF and record the conflict; do not repair either silently."
      locator: {handoff_lines: "11-15", section: "Part 1A: Status of this part"}

conformance_policy:
  primary_rule: "Preserve exact PDF clauses."
  when_pdf_clause_is_exact: "Use that clause without handoff normalization."
  when_pdf_itself_is_underdetermined: "stop/no repair"
  when_pdf_sections_are_in_tension: "preserve both locators; record the tension; do not harmonize silently"
  when_handoff_diverges: "preserve PDF; divergence remains audit-only"
  theorem_adjudication_allowed_in_this_artifact: false
  repair_allowed_in_this_artifact: false

intra_pdf_reading_order_for_conformance:
  status: "procedural conflict-resolution order, not an additional semantic axiom"
  provenance:
    file: "CR-1.0_Executable_Calculus_Handoff_Plan(2).md"
    locator: {handoff_lines: "464-474", section: "Authority hierarchy"}
  levels:
    - priority: 1
      unit: "Exact clauses in Model CR-1.0, including dependency identifiers"
      pdf_locators:
        - {pdf_pages: "219-234", report_pages: "218-233", section: "Model CR-1.0"}
    - priority: 2
      unit: "Explicit corrections, source-status labels, reconstruction notes, and non-derivability boundary"
      pdf_locators:
        - {pdf_pages: "219, 228, 233-256", report_pages: "218, 227, 232-255", section: "Model status; R/M note; §9-§10; audit disposition"}
    - priority: 3
      unit: "Source synthesis and unified concordance"
      pdf_locators:
        - {pdf_pages: "15-27", report_pages: "14-26", section: "Part I"}
        - {pdf_pages: "168-214", report_pages: "167-213", section: "Unified A-Z concordance"}
    - priority: 4
      unit: "Indexed primary sources quoted or cited in the report"
      pdf_locators:
        - {pdf_pages: "30-167", report_pages: "29-166", section: "Part II source dossiers"}
    - priority: 5
      unit: "Implementer's background knowledge or preferred formalism"
      pdf_locators: []
      authoritative: false
  limitation: "This order selects a conformance reading but never deletes an ambiguity record."

inferential_status_scheme:
  status: "procedural implementation scheme"
  allowed_values:
    - code: "DEF"
      meaning: "Eliminable abbreviation; exact unfolding creates no witness or world fact."
    - code: "IMP"
      meaning: "Declared independent premise with explicit scope and discharge conditions."
    - code: "DER"
      meaning: "Result derived from specified DEF, IMP, and prior DER dependencies by named legal rules."
  provenance:
    file: "CR-1.0_Executable_Calculus_Handoff_Plan(2).md"
    locator: {handoff_lines: "19-33", section: "Governing law"}
  exclusivity_rule: "No source-status or audit-state code is an inferential status."

source_status_schemes:
  - scheme_id: "REPORT-READING-MAP"
    scope: "Reading map and claim-status discipline"
    locators:
      - {pdf_pages: "12-13", report_pages: "11-12", section: "Claim statuses"}
    values:
      D: "Definition"
      X: "Explicit source claim"
      Q: "Qualified source conjecture"
      R: "Reconstruction"
      P: "Substantive postulate"
      CT: "Constructor-theory import"
      E: "Empirical premise"
      T: "Derived result"
      N: "Non-entailment"

  - scheme_id: "BOOK-INDEX"
    scope: "Clean-room book indexes"
    locators:
      - {pdf_page: 30, report_page: 29, section: "BoI index attribution discipline"}
      - {pdf_pages: "83-86", report_pages: "82-85", section: "FoR index"}
    values:
      E: "Explicit"
      Q: "Qualified"
      R: "Reconstruction"
      H: "Historical or context-bound"

  - scheme_id: "MODEL-CR-1.0"
    scope: "Model CR-1.0 source commitments"
    locators:
      - {pdf_page: 219, report_page: 218, section: "Model §0"}
    values:
      X: "Explicitly stated or directly argued by cited source"
      R: "Reconstruction making an explicit claim more exact"
      M: "Added modeling or audit choice"
      Q: "Qualified conjecture or guess in source"
      O: "Open problem acknowledged by source"

  - scheme_id: "PRECURSOR-AUDIT"
    scope: "Source-grounding audit of superseded precursor"
    locators:
      - {pdf_page: 236, report_page: 235, section: "Scope and verdict"}
    values:
      D: "Directly supported"
      R: "Faithful reconstruction"
      M: "Added methodological choice"
      U: "Unsupported or overreaching"

  - scheme_id: "APPLICATIONS"
    scope: "Downstream applications and adversarial audit"
    locators:
      - {pdf_page: 257, report_page: 256, section: "Status and scope"}
    values:
      K: "CR-1.0 consequence"
      C: "Conditional application result"
      E: "Empirical attribution"
      N: "Non-entailment"

source_to_inferential_mapping:
  automatic_mapping_exists: false
  rules:
    - "Source status X does not by itself make a declaration DER or establish actual truth."
    - "Source status R may be represented as DEF, IMP, or neither only after separate classification."
    - "Source status M normally signals an explicit modeling import but is not automatically IMP."
    - "Source status Q remains qualified; if used inferentially, adoption as an explicit IMP must be separately recorded."
    - "Source status O has no inferential force."
    - "Audit states such as blocker, ambiguity, tension, divergence, and intentional gap are never inferential statuses."
  handoff_locator: {handoff_lines: "450-462", section: "Source-status marks are orthogonal to inferential status"}

locator_precedence:
  exact_pdf_page: "required for every authority claim in machine drafts"
  report_footer_page: "required alongside PDF page where available"
  source_book_page: "secondary locator embedded by the report"
  handoff_line: "allowed only for procedural statements and divergence records"

divergence_policy:
  semantic_effect: "none"
  audit_only: true
  required_fields:
    - "handoff locator"
    - "PDF locator"
    - "candidate readings"
    - "conformance choice"
  default_conformance_choice: "preserve PDF wording"
  underdetermination_choice: "stop/no repair"

