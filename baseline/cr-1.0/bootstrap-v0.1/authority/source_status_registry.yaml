schema_version: "0.1-draft"
document_type: source_status_registry
authority:
  title: "Creativity as Explanatory Self-Correction"
  sha256: "08ff81e848fea976b558345402d85723173be8f40f1041fb00d6267f1e026b8b"
  sole_semantic_and_formal_authority: true
procedural_handoff:
  authority: false
  role: procedure_only
locator_convention:
  physical_pdf_pages_and_printed_report_pages_are_distinct: true
  relation_from_physical_page_2: "physical_pdf_page = printed_report_page + 1"
field_separation:
  source_status:
    required_fields: [scheme_id, raw_mark]
    section_local: true
    automatic_cross_scheme_normalization: false
  inferential_status_policy:
    allowed_values: [DEF, IMP, DER]
    assigned_in_this_registry: false
    automatic_mapping_from_source_status: false
  policy_statement: source_status_never_determines_inferential_status

schemes:
  - id: global_claim_v1
    namespace: report.reading_map.claim_status
    registry_locator:
      section_id: report.reading_map.claim_statuses
      physical_pdf_pages: {start: 13, end: 13}
      printed_report_pages: {start: 12, end: 12}
    marks:
      D: Definition
      X: Explicit_source_claim
      Q: Qualified_source_conjecture
      R: Reconstruction
      P: Substantive_postulate
      CT: Constructor_theory_import
      E: Empirical_premise
      T: Derived_result
      N: Non_entailment

  - id: boi_index_v1
    namespace: boi_index.status
    registry_locator:
      section_id: boi_index.scope_edition_attribution
      physical_pdf_pages: {start: 30, end: 30}
      printed_report_pages: {start: 29, end: 29}
    marks:
      E: Explicit
      Q: Qualified_or_open
      R: Reconstruction
      H: Historical_or_context_bound
    registered_compounds:
      - raw_mark: E/Q
        meaning: part_explicit_connection_qualified
      - raw_mark: Q/R
        meaning: qualified_authorial_claim_plus_index_reconstruction
    observed_additional_compounds: [Q/H, H/E]

  - id: for_index_v1
    namespace: for_index.status
    registry_locator:
      section_id: for_index.scope_edition_locator
      physical_pdf_pages: {start: 84, end: 84}
      printed_report_pages: {start: 83, end: 83}
    marks:
      Explicit: source_states_or_directly_argues
      Reconstruction: report_makes_dependency_or_consequence_explicit
      Gap: unresolved_or_not_determined_by_book
      Dated/contested: obsolete_qualified_inaccurate_or_contested_warning

  - id: ct_dossier_v1
    namespace: marletto_ct_dossier.status
    registry_locator:
      section_id: marletto_ct_dossier.section_1_2
      physical_pdf_pages: {start: 119, end: 119}
      printed_report_pages: {start: 118, end: 118}
    marks:
      D: Definition_or_stipulated_representational_convention
      P: Independent_physical_principle_or_meta_law
      R: Result_conditional_on_definitions_and_principles
      E: Empirical_or_accepted_scientific_claim
      C: Conjecture_programme_or_explicit_open_problem
      A: Analogy_story_or_thought_experiment

  - id: public_weight_v1
    namespace: public_corpus_dossier.weight
    registry_locator:
      section_id: public_corpus_dossier.scope_and_method
      physical_pdf_pages: {start: 143, end: 143}
      printed_report_pages: {start: 142, end: 142}
    marks:
      A: Deutsch_authored_text_paper_or_verbatim_transcript
      B: Recorded_interview_or_talk
      C: Reliable_report_profile_or_reconstruction
      S: Secondary_scholarship_or_criticism
    observed_compounds: [A/B, B/C, A/portal, A/index]
    orthogonal_fields: [access_status]

  - id: recent_delta_v1
    namespace: recent_primary_source_addendum.status
    registry_locator:
      section_id: recent_primary_source_addendum.evidential_convention
      physical_pdf_pages: {start: 164, end: 164}
      printed_report_pages: {start: 163, end: 163}
    marks:
      Direct_update: corrects_or_sharpens_claim_used_in_CR_1_0
      Physical_layer_update: bears_on_realization_not_semantic_meaning
      No_update: compatible_background_or_insufficiently_verified

  - id: concordance_v1
    namespace: unified_concordance.status
    registry_locator:
      section_id: unified_concordance.reading_key
      physical_pdf_pages: {start: 168, end: 168}
      printed_report_pages: {start: 167, end: 167}
    marks:
      E: Explicit_in_cited_source
      R: Reconstruction_or_cross_source_synthesis
      Q: Qualified_conjecture_gap_or_stronger_version_not_established
      C: Contested_dated_or_source_specific
    compound_operator: slash_joins_statuses

  - id: model_source_v1
    namespace: model_cr_1_0.source_status
    registry_locator:
      section_id: model_cr_1_0.section_0.status_and_source_discipline
      physical_pdf_pages: {start: 219, end: 219}
      printed_report_pages: {start: 218, end: 218}
    marks:
      X: explicitly_stated_or_directly_argued_by_cited_source
      R: reconstruction_that_makes_explicit_claim_more_exact
      M: added_modeling_or_audit_choice
      Q: qualified_conjecture_or_guess_in_source
      O: open_problem_acknowledged_by_source
    compound_syntax_defined_by_pdf: false
    observed_unregistered_compounds: ["R from X", R/M, X/R, X/R/Q, X/Q, X/O]

  - id: precursor_audit_v1
    namespace: superseded_precursor.status
    registry_locator:
      section_id: superseded_precursor.scope_and_verdict
      physical_pdf_pages: {start: 236, end: 236}
      printed_report_pages: {start: 235, end: 235}
    marks:
      D: directly_supported
      R: faithful_reconstruction
      M: added_methodological_choice
      U: unsupported_or_overreaching
    observed_compounds: [R/M, M/R, R/U, M/U, D/R, D/R/U]

  - id: application_claim_v1
    namespace: downstream_applications.claim_status
    registry_locator:
      section_id: downstream_applications.status_and_scope
      physical_pdf_pages: {start: 257, end: 257}
      printed_report_pages: {start: 256, end: 256}
    marks:
      K: CR_1_0_consequence
      C: Conditional_application_result
      E: Empirical_attribution
      N: Non_entailment

symbol_collisions:
  - raw_mark: D
    meanings_by_scheme:
      global_claim_v1: Definition
      ct_dossier_v1: Definition_or_stipulation
      precursor_audit_v1: directly_supported
  - raw_mark: X
    meanings_by_scheme:
      global_claim_v1: Explicit_source_claim
      model_source_v1: explicitly_stated_or_directly_argued
    note: BOI_and_concordance_use_E_for_explicit
  - raw_mark: E
    meanings_by_scheme:
      global_claim_v1: Empirical_premise
      boi_index_v1: Explicit
      ct_dossier_v1: Empirical_or_accepted_science
      concordance_v1: Explicit
      application_claim_v1: Empirical_attribution
  - raw_mark: R
    meanings_by_scheme:
      global_claim_v1: Reconstruction
      boi_index_v1: Reconstruction
      ct_dossier_v1: Conditional_result
      concordance_v1: Reconstruction_or_synthesis
      model_source_v1: exactifying_reconstruction
      precursor_audit_v1: faithful_reconstruction
  - raw_mark: P
    meanings_by_scheme:
      global_claim_v1: Substantive_postulate
      ct_dossier_v1: Physical_principle_or_meta_law
  - raw_mark: C
    meanings_by_scheme:
      ct_dossier_v1: Conjecture_programme_or_open_problem
      public_weight_v1: Reliable_report_or_reconstruction
      concordance_v1: Contested_dated_or_source_specific
      application_claim_v1: Conditional_application_result
  - raw_mark: A
    meanings_by_scheme:
      ct_dossier_v1: Analogy_story_or_thought_experiment
      public_weight_v1: Authored_or_direct
  - raw_mark: M
    meanings_by_scheme:
      model_source_v1: added_modeling_or_audit_choice
      precursor_audit_v1: added_methodological_choice
    lexical_warning: mathematical_model_metavariable_M_is_not_a_source_mark
  - raw_mark: Q
    meanings_by_scheme:
      global_claim_v1: Qualified_source_conjecture
      boi_index_v1: Qualified_or_open
      concordance_v1: Qualified_gap_or_stronger_not_established
      model_source_v1: Qualified_conjecture_or_guess
    note: final_model_separates_acknowledged_open_problem_as_O

