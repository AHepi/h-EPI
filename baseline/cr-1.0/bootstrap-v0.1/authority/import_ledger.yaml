    discharge_test: "Role-by-role representation/use evidence; for nonverbal criticism, I-MIND-TACIT and causal interventions."
    non_entailments: "Type membership, verbal form, or resemblance does not entail a semantic role; role overlap is not type identity."
    direct_known_dependents: "SC-2, DF-1/DF-2/DF-5, I-MIND-TACIT, I-ART/I-AR-SHARED."
