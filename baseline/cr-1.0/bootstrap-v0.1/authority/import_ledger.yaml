    alternatives: "Mutually exclusive ontological kinds; verbal-only content; analyst resemblance; role by token syntax."
    independence_witness_plan: "`W-SEM`: same content occupies multiple roles in one interpretation; contrast causally used inexplicit state with analyst-only resemblance."
    conceptual_necessity: "Permits role overlap and tacit realization without making semantics unconstrained."
    source_warrant:
      raw: "Active CR model p. 220, §1.1, paragraph immediately before TY-1; no itemized source tag."
      report_footer_declaration_pages: ["220"]
      physical_pdf_declaration_pages: ["221"]
