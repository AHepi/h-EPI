    record_key_kind: "audit_key"
    authoritative_owner: "active model §1.1"
    declaration_role: "implementation_local_audit_slot"
    layer: "Semantic/type policy."
    statement_role: "`AttemptExp`, `Criticism`, `Standard`, and `Problem` are semantic roles of contents, not mutually exclusive substances; contents may be explicit or inexplicit, but role assignment requires system-level causal use rather than resemblance judged by an analyst."
