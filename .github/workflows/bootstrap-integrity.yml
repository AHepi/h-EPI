name: bootstrap integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validator dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Validate package integrity and quarantine discipline
        run: python baseline/cr-1.0/bootstrap-v0.1/tools/validate_bootstrap.py
