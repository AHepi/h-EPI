name: bootstrap integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validator dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Validate package integrity and quarantine discipline
        run: python baseline/cr-1.0/bootstrap-v0.1/tools/validate_bootstrap.py
