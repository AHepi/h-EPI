name: bridge pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned schema-test dependencies
        run: python -m pip install -r requirements-bridge-ci.txt
      - name: Verify records and adversarial tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests
          python tools/verify_bridge.py
      - name: Reject unchecked Lean declarations
        run: |
          set +e
          grep -RInE '^[[:space:]]*(axiom|opaque)[[:space:]]|(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formal/CREIB formal/CREIB.lean
          grep_status=$?
          set -e
          if [ "$grep_status" -eq 0 ]; then
            echo "Forbidden unchecked Lean declaration found" >&2
            exit 1
          fi
          if [ "$grep_status" -ne 1 ]; then
            echo "Lean source scan failed" >&2
            exit "$grep_status"
          fi

  lean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-allow: ""
      - name: Verify pinned formal package and replay report
        run: python tools/verify_bridge.py --lean

  container-replay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned linux/amd64 replay image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --platform linux/amd64 \
            --pull=false \
            --file .devcontainer/Dockerfile \
            --tag cr-eib-replay:ci \
            .
          image_id="$(docker image inspect --format '{{.Id}}' cr-eib-replay:ci)"
          echo "container_image_id=${image_id}"
          echo "CR_EIB_IMAGE_ID=${image_id}" >> "${GITHUB_ENV}"
          echo "Container image ID: \`${image_id}\`" >> "${GITHUB_STEP_SUMMARY}"
      - name: Run networkless read-only smoke replay
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --workdir /repo \
            "${CR_EIB_IMAGE_ID}" \
            bash /repo/tools/container_smoke.sh
