name: bridge pilot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # compileall, the shipped-code assert guard, whitespace, and the Lean
    # source scan. The assert guard replaces the former second full test pass
    # under `python -O`: with no `assert` in src/ or tools/, that pass could
    # not exercise anything the normal pass did not.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Lint, assert guard, whitespace, Lean scan
        run: python tools/check.py lint

  evidence-records:
    # The Python suite runs once, split into two shards so neither job
    # approaches its budget. `test-slow` is the two scenario suites that
    # dominate wall time; `test-fast` is every other module plus the
    # bootstrap validator and bridge verifier.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [test-fast, test-slow]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-bridge-ci.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements-bridge-ci.txt
      - name: Run ${{ matrix.shard }}
        run: python tools/check.py ${{ matrix.shard }} -v
      - name: Verify records (bootstrap validator, bridge verifier)
        if: matrix.shard == 'test-fast'
        run: |
          python tools/check.py verify
          python tools/verify_bridge.py > verify-bridge-report.json
          cat verify-bridge-report.json
      - name: Retain verifier report as evidence
        if: matrix.shard == 'test-fast'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-bridge-report-${{ github.sha }}
          path: verify-bridge-report.json
          retention-days: 90

  lean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: formal
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-allow: ""
      - name: Verify pinned formal package and replay report
        run: |
          python tools/verify_bridge.py --lean > verify-bridge-lean-report.json
          cat verify-bridge-lean-report.json
      - name: Retain Lean replay report as evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-bridge-lean-report-${{ github.sha }}
          path: verify-bridge-lean-report.json
          retention-days: 90

  container-replay-smoke:
    # Cold-start replay in the pinned image. It runs the complete Python suite
    # once inside the container, so its budget is set from measured wall time
    # rather than hope; it is not gated on the other jobs so a replay failure
    # is always visible on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned linux/amd64 replay image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --platform linux/amd64 \
            --pull=false \
            --file .devcontainer/Dockerfile \
            --tag cr-eib-replay:ci \
            .
          image_id="$(docker image inspect --format '{{.Id}}' cr-eib-replay:ci)"
          echo "container_image_id=${image_id}"
          echo "CR_EIB_IMAGE_ID=${image_id}" >> "${GITHUB_ENV}"
          echo "Container image ID: \`${image_id}\`" >> "${GITHUB_STEP_SUMMARY}"
      - name: Run networkless read-only smoke replay
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            --workdir /repo \
            "${CR_EIB_IMAGE_ID}" \
            bash /repo/tools/container_smoke.sh
