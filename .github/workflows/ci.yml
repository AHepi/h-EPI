name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Offline only: no model is called in CI. lint = compileall, the
    # shipped-code assert guard, whitespace; test = the unittest suite;
    # pilots = validate and plan every pilot configuration.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-container.txt
      - name: Install hash-locked dependencies
        run: 'python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-container.txt'
      - name: Lint
        run: python tools/check.py lint
      - name: Test
        run: python tools/check.py test -v
      - name: Validate and plan every pilot
        run: python tools/check.py pilots
